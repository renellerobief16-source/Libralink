<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1020" width="1280" height="1020" style="background:#ffffff; font-family:Arial, sans-serif;">
  <defs>
    <!-- Marker for dashed include/extend arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
    <!-- Label background style -->
    <filter id="bg" x="-10%" y="-15%" width="120%" height="130%">
      <feFlood flood-color="#ffffff"/>
      <feComposite in="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="50" y="45" font-size="22" font-weight="bold" fill="#0F172A">LibraLink - UML Use Case Diagram</text>
  <text x="50" y="70" font-size="13" fill="#64748B">Actors, Associations, &lt;&lt;Include&gt;&gt;, and &lt;&lt;Extend&gt;&gt; Relationships</text>

  <!-- ========================================================================= -->
  <!-- 1. ACTORS (STICKMEN WITH BLUE HEADS MATCHING YOUR EXACT REFERENCE IMAGE)  -->
  <!-- ========================================================================= -->

  <!-- ACTOR 1: Student (x=100, y=220) -->
  <g id="actor_student">
    <!-- Blue Head -->
    <circle cx="100" cy="180" r="16" fill="#68C5F7" stroke="#000000" stroke-width="2"/>
    <!-- Spine -->
    <line x1="100" y1="196" x2="100" y2="245" stroke="#000000" stroke-width="2.2"/>
    <!-- Arms -->
    <line x1="72" y1="212" x2="128" y2="212" stroke="#000000" stroke-width="2.2"/>
    <!-- Left Leg -->
    <line x1="100" y1="245" x2="76" y2="285" stroke="#000000" stroke-width="2.2"/>
    <!-- Right Leg -->
    <line x1="100" y1="245" x2="124" y2="285" stroke="#000000" stroke-width="2.2"/>
    <!-- Label -->
    <text x="100" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Student</text>
  </g>

  <!-- ACTOR 2: Home-School Librarian (x=100, y=470) -->
  <g id="actor_homelib">
    <circle cx="100" cy="430" r="16" fill="#68C5F7" stroke="#000000" stroke-width="2"/>
    <line x1="100" y1="446" x2="100" y2="495" stroke="#000000" stroke-width="2.2"/>
    <line x1="72" y1="462" x2="128" y2="462" stroke="#000000" stroke-width="2.2"/>
    <line x1="100" y1="495" x2="76" y2="535" stroke="#000000" stroke-width="2.2"/>
    <line x1="100" y1="495" x2="124" y2="535" stroke="#000000" stroke-width="2.2"/>
    <text x="100" y="558" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Home-School</text>
    <text x="100" y="574" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Librarian</text>
  </g>

  <!-- ACTOR 3: Partner-School Librarian (x=100, y=680) -->
  <g id="actor_partnerlib">
    <circle cx="100" cy="650" r="16" fill="#68C5F7" stroke="#000000" stroke-width="2"/>
    <line x1="100" y1="666" x2="100" y2="715" stroke="#000000" stroke-width="2.2"/>
    <line x1="72" y1="682" x2="128" y2="682" stroke="#000000" stroke-width="2.2"/>
    <line x1="100" y1="715" x2="76" y2="755" stroke="#000000" stroke-width="2.2"/>
    <line x1="100" y1="715" x2="124" y2="755" stroke="#000000" stroke-width="2.2"/>
    <text x="100" y="778" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Partner-School</text>
    <text x="100" y="794" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Librarian</text>
  </g>

  <!-- ACTOR 4: Administrator (x=100, y=880) -->
  <g id="actor_admin">
    <circle cx="100" cy="860" r="16" fill="#68C5F7" stroke="#000000" stroke-width="2"/>
    <line x1="100" y1="876" x2="100" y2="925" stroke="#000000" stroke-width="2.2"/>
    <line x1="72" y1="892" x2="128" y2="892" stroke="#000000" stroke-width="2.2"/>
    <line x1="100" y1="925" x2="76" y2="965" stroke="#000000" stroke-width="2.2"/>
    <line x1="100" y1="925" x2="124" y2="965" stroke="#000000" stroke-width="2.2"/>
    <text x="100" y="988" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Administrator</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. SOLID ASSOCIATION LINES (Actor to Base Use Cases)                     -->
  <!-- ========================================================================= -->
  <!-- Student associations -->
  <line x1="130" y1="212" x2="310" y2="120" stroke="#000000" stroke-width="1.8"/>
  <line x1="130" y1="212" x2="320" y2="185" stroke="#000000" stroke-width="1.8"/>
  <line x1="130" y1="212" x2="310" y2="255" stroke="#000000" stroke-width="1.8"/>
  <line x1="130" y1="212" x2="310" y2="335" stroke="#000000" stroke-width="1.8"/>
  <line x1="130" y1="212" x2="310" y2="410" stroke="#000000" stroke-width="1.8"/>

  <!-- Home Librarian associations -->
  <line x1="130" y1="462" x2="320" y2="185" stroke="#000000" stroke-width="1.8"/>
  <line x1="130" y1="462" x2="310" y2="410" stroke="#000000" stroke-width="1.8"/>
  <line x1="130" y1="462" x2="300" y2="505" stroke="#000000" stroke-width="1.8"/>

  <!-- Partner Librarian associations -->
  <line x1="130" y1="682" x2="320" y2="185" stroke="#000000" stroke-width="1.8"/>
  <line x1="130" y1="682" x2="300" y2="650" stroke="#000000" stroke-width="1.8"/>
  <line x1="130" y1="682" x2="300" y2="735" stroke="#000000" stroke-width="1.8"/>

  <!-- Admin associations -->
  <line x1="130" y1="892" x2="320" y2="185" stroke="#000000" stroke-width="1.8"/>
  <line x1="130" y1="892" x2="320" y2="815" stroke="#000000" stroke-width="1.8"/>
  <line x1="130" y1="892" x2="310" y2="885" stroke="#000000" stroke-width="1.8"/>
  <line x1="130" y1="892" x2="310" y2="955" stroke="#000000" stroke-width="1.8"/>

  <!-- ========================================================================= -->
  <!-- 3. BASE USE CASES (Middle Column, x=420)                                  -->
  <!-- ========================================================================= -->

  <!-- UC: Register an account -->
  <ellipse cx="420" cy="120" rx="110" ry="26" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
  <text x="420" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Register an Account</text>

  <!-- UC: Log-in -->
  <ellipse cx="420" cy="185" rx="100" ry="24" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
  <text x="420" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Log-in</text>

  <!-- UC: Search for Books -->
  <ellipse cx="420" cy="255" rx="110" ry="26" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
  <text x="420" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Search for Books</text>

  <!-- UC: Submit a Request (with Extension Point) -->
  <g id="uc_submit">
    <ellipse cx="420" cy="335" rx="110" ry="32" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
    <line x1="320" y1="335" x2="520" y2="335" stroke="#000000" stroke-width="1.2"/>
    <text x="420" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Submit a Request</text>
    <text x="420" y="348" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">extension points</text>
    <text x="420" y="359" text-anchor="middle" font-size="9" fill="#000000">Access Approved Resources</text>
  </g>

  <!-- UC: Monitor Request Status -->
  <ellipse cx="420" cy="410" rx="110" ry="26" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
  <text x="420" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Monitor Request Status</text>

  <!-- UC: Review Student Requests (with Extension Point) -->
  <g id="uc_review">
    <ellipse cx="420" cy="510" rx="120" ry="36" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
    <line x1="310" y1="510" x2="530" y2="510" stroke="#000000" stroke-width="1.2"/>
    <text x="420" y="498" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Review Student Requests</text>
    <text x="420" y="523" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">extension points</text>
    <text x="420" y="536" text-anchor="middle" font-size="9.5" fill="#000000">Approve / Disapprove</text>
  </g>

  <!-- UC: Verify Approved Requests -->
  <ellipse cx="420" cy="650" rx="120" ry="28" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
  <text x="420" y="655" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Verify Approved Requests</text>

  <!-- UC: Process Applicable Access Requests -->
  <ellipse cx="420" cy="735" rx="125" ry="28" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
  <text x="420" y="740" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Process Applicable Access Requests</text>

  <!-- Admin Use Cases -->
  <ellipse cx="420" cy="815" rx="100" ry="24" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
  <text x="420" y="820" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Manage Users</text>

  <ellipse cx="420" cy="885" rx="115" ry="26" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
  <text x="420" y="890" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Manage Participating Schools</text>

  <ellipse cx="420" cy="955" rx="110" ry="26" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
  <text x="420" y="960" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Manage System Records</text>

  <!-- ========================================================================= -->
  <!-- 4. SUB USE CASES (Right Column, x=920)                                    -->
  <!-- ========================================================================= -->

  <!-- Check Book Availability -->
  <ellipse cx="920" cy="215" rx="115" ry="26" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
  <text x="920" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000">Check Book Availability</text>

  <!-- View Partner-School Suggestions -->
  <ellipse cx="920" cy="280" rx="125" ry="26" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
  <text x="920" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">View Partner-School Suggestions</text>

  <!-- Access Approved Resources (Extension) -->
  <ellipse cx="920" cy="355" rx="120" ry="26" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
  <text x="920" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Access Approved Resources</text>

  <!-- Verify Submitted Information -->
  <ellipse cx="920" cy="460" rx="120" ry="26" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
  <text x="920" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Verify Submitted Information</text>

  <!-- Approve Requests (Extension) -->
  <ellipse cx="920" cy="530" rx="100" ry="24" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
  <text x="920" y="535" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Approve Requests</text>

  <!-- Disapprove Requests (Extension) -->
  <ellipse cx="920" cy="590" rx="105" ry="24" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
  <text x="920" y="595" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000">Disapprove Requests</text>

  <!-- Confirm Resource Availability -->
  <ellipse cx="920" cy="670" rx="120" ry="26" fill="#68C5F7" stroke="#000000" stroke-width="1.8"/>
  <text x="920" y="675" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Confirm Resource Availability</text>

  <!-- ========================================================================= -->
  <!-- 5. <<INCLUDE>> RELATIONSHIPS (Dashed Arrows to Target)                   -->
  <!-- ========================================================================= -->
  
  <!-- Search -> Check Book Availability -->
  <path d="M 525 245 L 805 220" fill="none" stroke="#000000" stroke-width="1.6" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="660" y="225" text-anchor="middle" font-size="11" font-style="italic" fill="#000000" filter="url(#bg)">&lt;&lt;Include&gt;&gt;</text>

  <!-- Search -> View Partner Suggestions -->
  <path d="M 525 260 L 795 275" fill="none" stroke="#000000" stroke-width="1.6" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="660" y="278" text-anchor="middle" font-size="11" font-style="italic" fill="#000000" filter="url(#bg)">&lt;&lt;Include&gt;&gt;</text>

  <!-- Submit Request -> Check Availability -->
  <path d="M 520 315 L 815 235" fill="none" stroke="#000000" stroke-width="1.6" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="685" y="265" text-anchor="middle" font-size="11" font-style="italic" fill="#000000" filter="url(#bg)">&lt;&lt;Include&gt;&gt;</text>

  <!-- Review Requests -> Verify Submitted Info -->
  <path d="M 535 490 L 800 465" fill="none" stroke="#000000" stroke-width="1.6" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="670" y="472" text-anchor="middle" font-size="11" font-style="italic" fill="#000000" filter="url(#bg)">&lt;&lt;Include&gt;&gt;</text>

  <!-- Verify Approved -> Confirm Resource Availability -->
  <path d="M 535 655 L 800 668" fill="none" stroke="#000000" stroke-width="1.6" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="670" y="655" text-anchor="middle" font-size="11" font-style="italic" fill="#000000" filter="url(#bg)">&lt;&lt;Include&gt;&gt;</text>

  <!-- ========================================================================= -->
  <!-- 6. <<EXTEND>> RELATIONSHIPS (Dashed Arrows From Extension to Base Point)  -->
  <!-- ========================================================================= -->

  <!-- Access Approved Resources -> Submit Request -->
  <path d="M 800 355 L 535 342" fill="none" stroke="#000000" stroke-width="1.6" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="670" y="342" text-anchor="middle" font-size="11" font-style="italic" fill="#000000" filter="url(#bg)">&lt;&lt;Extend&gt;&gt;</text>

  <!-- Approve Requests -> Review Requests -->
  <path d="M 820 528 L 542 516" fill="none" stroke="#000000" stroke-width="1.6" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="675" y="515" text-anchor="middle" font-size="11" font-style="italic" fill="#000000" filter="url(#bg)">&lt;&lt;Extend&gt;&gt;</text>

  <!-- Disapprove Requests -> Review Requests -->
  <path d="M 815 585 L 535 530" fill="none" stroke="#000000" stroke-width="1.6" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="680" y="565" text-anchor="middle" font-size="11" font-style="italic" fill="#000000" filter="url(#bg)">&lt;&lt;Extend&gt;&gt;</text>

</svg>
