  <script>
    function downloadSvg() {
      const svg = document.getElementById('svg-complete-usecase');
      const str = new XMLSerializer().serializeToString(svg);
      const blob = new Blob([str], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Figure_4_10_Complete_Actor_to_Use_Case_Diagram.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function downloadPng() {
      const svg = document.getElementById('svg-complete-usecase');
      const svgStr = new XMLSerializer().serializeToString(svg);
      const canvas = document.createElement('canvas');
      const scale = 2.5;
      canvas.width = 1420 * scale;
      canvas.height = 1180 * scale;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      img.onload = function() {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);

        canvas.toBlob(function(blob) {
          const pngUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = pngUrl;
          a.download = 'Figure_4_10_Complete_Actor_to_Use_Case_Diagram.png';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(pngUrl);
        }, 'image/png');
      };
      img.src = url;
    }
  </script>
