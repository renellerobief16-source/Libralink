<!DOCTYPE html>

<h1>Sprint Flowcharts Renderer</h1>

<!-- ==================================================== -->
<!-- SPRINT 1: CROSS-SCHOOL SEARCH & HOLDING DISCOVERY   -->

    <text x="521" y="183" text-anchor="middle" font-size="9" font-weight="800" fill="#dc2626">NO</text>

    <!-- 4. Cross-School Consortia Scanner -->

    <text x="500" y="238" text-anchor="middle" font-size="11" font-weight="700">4. Partner Holding Scan</text>
    <text x="500" y="254" text-anchor="middle" font-size="9.5" fill="#475569">Scan Partner Campus DB</text>
    <text x="500" y="268" text-anchor="middle" font-size="9.5" fill="#475569">(GNC &lt;--&gt; SRC Catalogs)</text>

    <!-- Arrow 4 -> Diamond 2 (Downwards) -->
    <line x1="500" y1="280" x2="500" y2="310" stroke="#0f172a" stroke-width="2"/>
    <polygon points="495,305 500,315 505,305" fill="#0f172a"/>

    <!-- 5. Decision Diamond 2: Partner Available? -->
    <polygon points="500,315 570,350 500,385 430,350" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>

    <text x="500" y="361" text-anchor="middle" font-size="10" font-weight="700" fill="#0284c7">&gt; 0?</text>

    <!-- Branch YES (Right) -> Recommendation Banner -->
    <line x1="570" y1="350" x2="635" y2="350" stroke="#0f172a" stroke-width="2"/>
    <polygon points="630,345 640,350 630,355" fill="#0f172a"/>
    <rect x="585" y="331" width="36" height="18" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="603" y="344" text-anchor="middle" font-size="9" font-weight="800" fill="#059669">YES</text>

    <!-- Partner Banner Node -->
    <rect x="640" y="315" width="180" height="70" rx="8" fill="#eff6ff" stroke="#0284c7" stroke-width="2"/>
    <text x="730" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">Partner Holding Banner</text>
    <text x="730" y="354" text-anchor="middle" font-size="9.5" fill="#0284c7">Display Partner Campus</text>
    <text x="730" y="369" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0284c7">[Request Borrow] Action</text>

    <!-- Arrow Partner -> Inter-School Flow -->
    <line x1="820" y1="350" x2="860" y2="350" stroke="#0284c7" stroke-width="2"/>
    <polygon points="855,345 865,350 855,355" fill="#0284c7"/>
    <circle cx="890" cy="350" r="22" fill="#0284c7" stroke="#0f172a" stroke-width="2"/>
    <text x="890" y="347" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Sprint 2</text>
    <text x="890" y="360" text-anchor="middle" font-size="8" fill="#e0f2fe">Request</text>

    <!-- Branch NO (Left) -> Unavailable Notice -->
    <line x1="430" y1="350" x2="365" y2="350" stroke="#0f172a" stroke-width="2"/>
    <polygon points="370,345 360,350 370,355" fill="#0f172a"/>
    <rect x="380" y="331" width="30" height="18" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="395" y="344" text-anchor="middle" font-size="9" font-weight="800" fill="#dc2626">NO</text>

    <!-- Unavailable Node -->
    <rect x="180" y="315" width="180" height="70" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="270" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">Zero Copies Available</text>
    <text x="270" y="354" text-anchor="middle" font-size="9.5" fill="#c2410c">Unavailable in Consortium</text>
    <text x="270" y="369" text-anchor="middle" font-size="9.5" fill="#7c2d12">Suggest Related Topics</text>

    <!-- End Icon -->
    <line x1="180" y1="350" x2="135" y2="350" stroke="#ea580c" stroke-width="2"/>
    <polygon points="140,345 130,350 140,355" fill="#ea580c"/>
    <circle cx="105" cy="350" r="20" fill="#64748b" stroke="#0f172a" stroke-width="2"/>
    <text x="105" y="354" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">End</text>
  </svg>
</div>

<!-- SPRINT 2: INTER-LIBRARY REQUEST & TOKEN ENGINE      -->
<!-- ==================================================== -->
<div class="canvas-box">

    </text>

    <text x="672" y="114" text-anchor="middle" font-size="9.5" fill="#0284c7">Circulation Inbox Review</text>

    <!-- Arrow 4 -> Decision Diamond (Downwards) -->

    <!-- 5. Decision Diamond: Approved? -->

  </svg>
</div>

<script>
  async function exportAndPost(svgId, filename) {
    const svg = document.getElementById(svgId);
    const svgData = new XMLSerializer().serializeToString(svg);
    const canvas = document.createElement("canvas");
    const scale = 2; // high res
    canvas.width = svg.getAttribute("width") * scale;
    canvas.height = svg.getAttribute("height") * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const img = new Image();
    const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);

    return new Promise((resolve) => {
      img.onload = async () => {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        const base64 = canvas.toDataURL("image/png");
        try {
          const res = await fetch('http://localhost:3333/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename, base64 })
          });
          const json = await res.json();
          console.log('Successfully posted', filename, json);
        } catch (e) {
          console.error('Failed to post', filename, e);
        }
        resolve();
      };
      img.src = url;
    });
  }

  async function runAll() {
    console.log('Starting automated export...');
    await exportAndPost('svg-sprint-1', 'Figure_4_1_Sprint_1_Search_Workflow.png');
    await exportAndPost('svg-sprint-2', 'Figure_4_2_Sprint_2_Token_Lifecycle.png');
    await exportAndPost('svg-sprint-3', 'Figure_4_3_Sprint_3_Counter_Circulation.png');
    console.log('Finished export of all 3 diagrams!');
    const status = document.createElement('div');
    status.id = 'export-complete-flag';
    status.textContent = 'EXPORT_DONE';
    document.body.appendChild(status);
  }

  document.getElementById('btn-download').addEventListener('click', runAll);
  window.addEventListener('load', () => {
    setTimeout(runAll, 500);
  });
</script>
