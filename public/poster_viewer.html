<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibraLink Capstone Poster Graphic Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    .header {
      text-align: center;
      margin-bottom: 1.5rem;
      max-width: 600px;
    }
    h1 { font-size: 1.75rem; color: #38bdf8; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.95rem; }
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #0369a1; }
    .btn-secondary {
      background: #334155;
    }
    .btn-secondary:hover { background: #475569; }
    .preview-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 900px;
      width: 100%;
    }
    .preview-card.checkerboard {
      background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      background-color: #0f172a;
    }
    .preview-card.light {
      background: #f1f5f9;
    }
    img {
      max-width: 100%;
      height: auto;
      max-height: 75vh;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📱 LibraLink Capstone Poster Centerpiece</h1>
    <p>3D Tilted View • Portal Hole • Small Books Stream • Official GNC & SRC Logos</p>
  </div>

  <div class="controls">
    <a href="/libralink_capstone_poster.jpg" download="libralink_capstone_centerpiece.jpg" class="btn">
      ⬇️ Download Image (Para sa Canva / PPT)
    </a>
    <button class="btn btn-secondary" onclick="toggleBg('checkerboard')">🏁 Checkerboard BG</button>
    <button class="btn btn-secondary" onclick="toggleBg('dark')">⬛ Dark BG</button>
    <button class="btn btn-secondary" onclick="toggleBg('light')">⬜ Light BG</button>
  </div>

  <div class="preview-card checkerboard" id="card">
    <img src="/libralink_capstone_poster.jpg" alt="LibraLink Capstone Poster Centerpiece" id="previewImg">
  </div>

  <script>
    function toggleBg(type) {
      const card = document.getElementById('card');
      card.className = 'preview-card ' + type;
    }
  </script>

</body>
</html>
